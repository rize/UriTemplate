name: CI

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master
  schedule:
    - cron: '0 0 1 * *' # Run monthly
  workflow_dispatch:

jobs:
  cs-fix:
    name: CS Fixer
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 'highest'

    - name: Install dependencies
      run: composer install

    - name: Run CS Fixer
      run: composer run-script cs

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 'highest'

    - name: Install dependencies
      run: composer install

    - name: Run CS Fixer
      run: composer run-script phpstan

  tests:
    name: PHPUnit on PHP ${{ matrix.php-versions }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php-versions: ['8.1', '8.2', '8.3', 'highest']

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-versions }}

    - name: Install dependencies
      run: composer install

    - name: Run tests
      run: composer run-script test
